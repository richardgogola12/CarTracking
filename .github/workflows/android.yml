name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # na vytvorenie Release s APK

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK je na ubuntu runneri predinštalovaný
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Unit tests + build APK
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Výsledky unit testov
        if: always()
        run: |
          R=app/build/test-results/testReleaseUnitTest
          if ls $R/*.xml >/dev/null 2>&1; then
            sum() { grep -ho "$1=\"[0-9]*\"" $R/*.xml | head -n 1000 | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}'; }
            echo "::notice::Unit testy: $(sum tests) testov v $(ls $R/*.xml | wc -l) triedach, zlyhania: $(sum failures), chyby: $(sum errors)"
            grep -l '<failure' $R/*.xml | while read -r f; do grep -A3 '<failure' "$f" | head -8 | while IFS= read -r l; do echo "::error::$(basename "$f"): ${l//%/%25}"; done; done
          fi

      # Chyby kompilácie ako anotácie (viditeľné v prehľade buildu)
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|AAPT|Execution failed|FAILED|AssertionError|expected:" -A2 build.log | head -80 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Trasnik-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Trasnik-apk
          path: android/app/build/outputs/apk/release/Trasnik-${{ github.run_number }}.apk

      # Náhľady widgetov (vykreslené testom) – samostatné predbežné vydanie, nie je to aktualizácia aplikácie
      - name: Publish widget previews
        if: github.event_name != 'pull_request' && hashFiles('android/app/build/widget-previews/*.png') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-previews
          name: Náhľady widgetov
          prerelease: true
          make_latest: false
          body: Obrázky widgetov vykreslené automatickým testom (Robolectric) pri poslednom zostavení – na kontrolu dizajnu.
          files: android/app/build/widget-previews/*.png

      # Release = APK stiahnuteľné priamo do telefónu (bez prihlásenia a rozbaľovania zip)
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Trasník build ${{ github.run_number }}
          body: Automaticky zostavené APK (podpísané pevným kľúčom – inštaluje sa ako aktualizácia) z commitu ${{ github.sha }}.
          files: android/app/build/outputs/apk/release/Trasnik-${{ github.run_number }}.apk
