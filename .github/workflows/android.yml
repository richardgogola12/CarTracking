name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # na vytvorenie Release s APK

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK je na ubuntu runneri predinštalovaný
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      # Chyby kompilácie ako anotácie (viditeľné v prehľade buildu)
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|AAPT|Execution failed" -A2 build.log | head -80 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/CarTracking-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarTracking-apk
          path: android/app/build/outputs/apk/release/CarTracking-${{ github.run_number }}.apk

      # Release = APK stiahnuteľné priamo do telefónu (bez prihlásenia a rozbaľovania zip)
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Car Tracking build ${{ github.run_number }}
          body: Automaticky zostavené APK (podpísané pevným kľúčom – inštaluje sa ako aktualizácia) z commitu ${{ github.sha }}.
          files: android/app/build/outputs/apk/release/CarTracking-${{ github.run_number }}.apk
