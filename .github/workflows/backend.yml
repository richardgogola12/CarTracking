name: Backend API test

on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Schéma databázy
        run: |
          set -o pipefail
          M="mysql -h127.0.0.1 -uroot -proot --default-character-set=utf8mb4"
          for i in $(seq 1 30); do $M -e "SELECT 1" >/dev/null 2>&1 && break; echo "čakám na MySQL…"; sleep 2; done
          $M < backend/schema.sql 2>&1 | tee schema.log || { while IFS= read -r l; do echo "::error::$l"; done < schema.log; exit 1; }
          $M -e "CREATE USER 'car_tracking'@'%' IDENTIFIED BY 'test'; GRANT SELECT, INSERT, UPDATE, DELETE ON car_tracking.* TO 'car_tracking'@'%';" 2>&1 | tee user.log || { while IFS= read -r l; do echo "::error::$l"; done < user.log; exit 1; }
      - name: Spustiť PHP server
        env:
          CT_DB_HOST: 127.0.0.1
          CT_DB_USER: car_tracking
          CT_DB_PASS: test
        run: |
          php -v | head -1
          php -S 127.0.0.1:8080 backend/api/index.php > php.log 2>&1 &
          sleep 2
      - name: Test API
        run: bash backend/tests/api_test.sh http://127.0.0.1:8080
      - name: Log PHP servera
        if: failure()
        run: tail -50 php.log | while IFS= read -r l; do echo "::error::$l"; done
      - name: Test migrácií (starší stav → v3)
        run: |
          set -o pipefail
          M="mysql -h127.0.0.1 -uroot -proot --default-character-set=utf8mb4"
          $M -e "DROP DATABASE car_tracking"
          git show c958f61~1:backend/schema.sql > /tmp/old.sql
          for f in /tmp/old.sql backend/migrate_v2.sql backend/migrate_v3.sql backend/migrate_v4.sql; do
            $M < "$f" 2>&1 | tee m.log || { while IFS= read -r l; do echo "::error::$f: $l"; done < m.log; exit 1; }
          done
          echo "::notice::Migrácie v2 a v3 prešli"
