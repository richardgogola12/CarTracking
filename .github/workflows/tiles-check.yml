name: Tile servers check
on:
  push:
    paths: ['.github/workflows/tiles-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          check() {
            r=$(curl -s -o t.bin -w '%{http_code} %{size_download} %{content_type}' --max-time 20 -A 'sk.cartracker/1.1 (Android)' "$2")
            h=$(md5sum t.bin | cut -c1-8)
            echo "$1 => $r md5=$h" >> res.txt
          }
          check carto-voyager "https://a.basemaps.cartocdn.com/rastertiles/voyager/14/9070/5650@2x.png"
          check carto-light "https://a.basemaps.cartocdn.com/light_all/14/9070/5650@2x.png"
          check osm "https://tile.openstreetmap.org/14/9070/5650.png"
          check osm-hot "https://a.tile.openstreetmap.fr/hot/14/9070/5650.png"
          check opentopo "https://a.tile.opentopomap.org/14/9070/5650.png"
          check esri-imagery "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/14/5650/9070"
          check esri-street "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/14/5650/9070"
          check esri-topo "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/14/5650/9070"
          check esri-lightgray "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/14/5650/9070"
          check esri-darkgray "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/14/5650/9070"
          check esri-light-ref "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/14/5650/9070"
          check esri-dark-ref "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/14/5650/9070"
          check esri-light-z17 "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/17/45204/72563"
          check esri-street-z18 "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/18/90409/145127"
          check stadia "https://tiles.stadiamaps.com/tiles/alidade_smooth/14/9070/5650.png"
          check cyclosm "https://a.tile-cyclosm.openstreetmap.fr/cyclosm/14/9070/5650.png"
          echo "::notice::$(paste -sd '|' res.txt)"
