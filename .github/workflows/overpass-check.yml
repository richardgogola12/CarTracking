name: Road check
on:
  push:
    paths: ['.github/workflows/overpass-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          cat > t.py <<'PY'
          import json, time, math, urllib.request, urllib.parse
          UA = {"User-Agent": "CarTracking/1.3 (Android app; github.com/richardgogola12/CarTracking)"}
          def get(url):
              t = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=15) as r:
                      return json.load(r), round(time.time() - t, 2)
              except Exception as e:
                  return {"error": str(e)[:60]}, round(time.time() - t, 2)
          def dist(a, b, c, d):
              return 6371000 * 2 * math.asin(math.sqrt(math.sin(math.radians(c-a)/2)**2 + math.cos(math.radians(a))*math.cos(math.radians(c))*math.sin(math.radians(d-b)/2)**2))
          out = []
          def rev(name, lat, lon):
              road, t1 = get(f"https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat={lat}&lon={lon}&zoom=17&extratags=1")
              time.sleep(1.1)
              bld, t2 = get(f"https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat={lat}&lon={lon}&zoom=18&addressdetails=1")
              time.sleep(1.1)
              d = round(dist(lat, lon, float(bld.get("lat", 0)), float(bld.get("lon", 0)))) if "lat" in bld else None
              out.append(f"{name} ({t1}s/{t2}s): road={road.get('category')}/{road.get('type')} '{road.get('name')}' maxspeed={(road.get('extratags') or {}).get('maxspeed')} | nearest={bld.get('category')}/{bld.get('type')} hn={(bld.get('address') or {}).get('house_number')} dist={d}m")
          def search(q):
              r, _ = get("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=" + urllib.parse.quote(q))
              time.sleep(1.1)
              return (float(r[0]["lat"]), float(r[0]["lon"])) if isinstance(r, list) and r else None
          for name, q in [("imel-centrum", "Imeľ, Slovensko"), ("d1-senec", "diaľnica D1, Senec"), ("bratislava-vajnorska", "Vajnorská, Bratislava"), ("r1-nitra", "rýchlostná cesta R1, Nitra")]:
              p = search(q)
              if p: rev(name, *p)
              else: out.append(f"{name}: search failed")
          # bod medzi obcami (cesta Imeľ – Kameničná)
          a = search("Imeľ, Slovensko"); b = search("Kameničná, Slovensko")
          if a and b: rev("medzi-imel-kamenicna", (a[0]+b[0])/2, (a[1]+b[1])/2)
          print("\n".join(out)); open("res.txt","w").write("\n".join(out))
          PY
          python3 t.py
          echo "::notice::$(paste -sd '|' res.txt)"
